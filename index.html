<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cross-Stitch Banner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Layout: one full-bleed banner at the top of a desktop page; portrait centred, standing on the bottom edge, head top at 30% height.
     The stitch field covers the whole banner. */
  :root {
    --bg: #FFFFFF;          /* white ground */
    --page: #FFFFFF;        /* placeholder for the page content under the banner */
    --grain: 0.15;          /* grain layer opacity over the whole banner */
    --btn-bg: rgba(255, 255, 255, 0.55);
    --btn-fg: #2E2F31;
    --btn-ring: rgba(46, 47, 49, 0.18);
    color-scheme: light;
  }
  /* Charcoal mode, switched by the corner button (kept separate from the viewer's own theme). */
  :root[data-mode="dark"] {
    --bg: #121213;
    --page: #0E0E0F;
    --btn-bg: rgba(0, 0, 0, 0.35);
    --btn-fg: #E6E4DF;
    --btn-ring: rgba(255, 255, 255, 0.16);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); margin: 0; }

  .banner {
    position: relative;
    width: 100%;
    height: clamp(480px, 72vh, 860px);
    background: var(--bg);
    overflow: hidden;
    isolation: isolate;
    touch-action: none;     /* finger drags stitch instead of scrolling */
    user-select: none;
    -webkit-user-select: none;
  }
  .banner canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

  /* Sky gradient behind everything: drawn small and scaled up with hard edges, so it reads slightly pixelated. */
  .banner canvas#skybg { image-rendering: pixelated; image-rendering: crisp-edges; }

  .portrait {
    position: absolute;
    left: 50%;
    bottom: 0;
    height: 70%;            /* leaves the top 30% of the banner empty above the head */
    width: auto;
    max-width: none;
    transform: translateX(-50%);
    filter: contrast(0.94) brightness(0.96);
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: overlay;
    opacity: var(--grain);
    background-size: 256px 256px;
  }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .mode-toggle {
    position: absolute;
    top: 16px;
    right: max(16px, env(safe-area-inset-right, 0px));
    z-index: 2;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    padding: 0;
    border: 1px solid var(--btn-ring);
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--btn-fg);
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 0.2s, transform 0.2s;
  }
  .mode-toggle:hover { transform: scale(1.06); }
  .mode-toggle:focus-visible { outline: 2px solid var(--btn-fg); outline-offset: 2px; }
  .mode-toggle svg { width: 18px; height: 18px; }
  .mode-toggle .sun { display: none; }
  :root[data-mode="dark"] .mode-toggle .sun { display: block; }
  :root[data-mode="dark"] .mode-toggle .moon { display: none; }

  .below {
    min-height: 40vh;
    background: var(--page);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
</style>

<header class="banner" id="banner">
  <canvas id="skybg" aria-hidden="true"></canvas>
  <canvas id="grid" aria-hidden="true"></canvas>
  <img class="portrait" src="assets/portrait.webp" alt="Greyscale portrait of a smiling woman with long dark hair in a white sleeveless top" draggable="false">
  <canvas id="dissolve" aria-hidden="true"></canvas>
  <canvas id="stitches" aria-hidden="true"></canvas>
  <canvas id="nametext" aria-hidden="true"></canvas>
  <h1 class="sr-only">Hi, I'm Anushka</h1>
  <canvas id="bird" aria-hidden="true"></canvas>
  <div class="grain" id="grain" aria-hidden="true"></div>
  <button class="mode-toggle" id="modeToggle" type="button" aria-label="Switch to charcoal mode" aria-pressed="false">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
  </button>
</header>
<main class="below" aria-label="Page content placeholder"></main>

<script>
  // ---- Settings ----------------------------------------------------------
  const COLS = 90;             // cells across the banner width
  const FIELD_W = 1;            // stitch field width, share of banner width (centred)
  const FIELD_TOP = 0;       // stitch field top, share of banner height (runs to the bottom edge)
  const BRUSH = 6;            // brush radius in cells
  const LIFE = 6000;            // ms a stitch lasts after the cursor passes: 5 s solid, then the fade
  const FADE = 1000;             // ms of that spent fading out
  // Portrait layer: one red, from pale tint (highlights) to deep shade (shadows).
  const SUB = 2;               // fine stitches per cell side over the person
  // Colours per mode. In charcoal the portrait is stitched from its light: bright areas get the heaviest, palest
  // thread and shadows thin, dim strokes, so she still reads the right way round on a dark ground.
  const MODES = {
    light: { tint: [206, 118, 110], shade: [140, 32, 36], paper: '#FFFFFF', invert: false,
             skyTones: [[255, 255, 255], [255, 255, 255], [255, 255, 255], [255, 255, 255]],
             word: '#173F80', wordText: '#173F80', wordSmall: '#3F7FCB', sky: '#4A9BD9', skyLight: '#A6D3F1', cloudWarm: '#F4BC86', cloudShade: '#B4A2DC', skyPale: '#BFD7F3', skyWhite: '#E4F2FC', skyShadow: 'rgba(30, 60, 120, 0.22)', grid: 'rgba(0,0,0,0.022)', bird: '#D64A42', birdShadow: 'rgba(60, 20, 20, 0.18)' },
    // Charcoal is fully greyscale: only the portrait stitches and the dove keep their colour.
    dark:  { tint: [110, 44, 46], shade: [240, 168, 158], paper: '#121213', invert: true,
             skyTones: [[14, 14, 15], [17, 17, 18], [20, 20, 21], [23, 23, 24]],
             word: '#E0574F', wordText: '#E6E6E6', wordSmall: '#A0A1A4', sky: '#5C5D61', skyLight: '#8E8F92', cloudWarm: '#8E8F92', cloudShade: '#66676A', skyPale: '#8E8F92', skyWhite: '#D9D9DA', skyShadow: 'rgba(0, 0, 0, 0.35)', grid: 'rgba(255,255,255,0.035)', bird: '#E0574F', birdShadow: 'rgba(0, 0, 0, 0)' },
  };
  let M = MODES.light;

  const banner = document.getElementById('banner');
  const portrait = document.querySelector('.portrait');
  const gridCanvas = document.getElementById('grid');
  const stitchCanvas = document.getElementById('stitches');
  const gctx = gridCanvas.getContext('2d');
  const sctx = stitchCanvas.getContext('2d');
  const skyCanvas = document.getElementById('skybg');
  const kctx = skyCanvas.getContext('2d');
  const SKY_PX = 7;             // size of one background sky pixel, in CSS px
  const dissolveCanvas = document.getElementById('dissolve');
  const dctx = dissolveCanvas.getContext('2d');
  const nameCanvas = document.getElementById('nametext');
  const nctx = nameCanvas.getContext('2d');
  const birdCanvas = document.getElementById('bird');
  const bctx = birdCanvas.getContext('2d');

  let W = 0, H = 0, DPR = 1, cell = 6, rows = 0;
  let field = { c0: 0, c1: 0, r0: 0, r1: 0 };
  let cols = 0, tone = null, person = null;  // tone per fine stitch: -1 outside the person, else 0 (light) .. 1 (dark)
                                             // person per cell: how many of its fine stitches fall on the person

  // ---- Helpers -------------------------------------------------------------
  // Integer hash -> [0,1). Same cell always gives the same value.
  function hash(x, y, s) {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---- Sky: a pixel-dithered cloudscape in one blue ----------------------
  // Every fine stitch outside the person gets a density, 0 (bare) to 1 (solid). An ordered dither decides
  // which are sewn, so dense sky, bright billowing cloud tops and the hazy lower bank read like a halftone.
  const SKY_DENSITY = 1.9;     // sky stitches per cell side: about 8.4px apart on a 1440px banner
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
  let sky = null;

  function noise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), d = hash(xi, yi + 1, s), e = hash(xi + 1, yi + 1, s);
    const top = a + (b - a) * sx, bot = d + (e - d) * sx;
    return top + (bot - top) * sy;
  }
  function fbm(x, y, s) {
    let v = 0, amp = 0.5, f = 1;
    for (let o = 0; o < 5; o++) { v += amp * noise(x * f, y * f, s + o); amp *= 0.5; f *= 2; }
    return v / 0.97;
  }

  // The sky is a halftone like the cloud reference: blue stitches dense in open sky, clouds left as bare
  // cloth. There are many small clouds scattered across the banner, each about two or three brush
  // strokes wide, so a viewer can uncover a whole one in a couple of moves. Each cloud is a cluster of
  // round puffs on a flat base, shaded a little toward its underside. skyTime drives the background only.
  let skyTime = 0, clouds = [];
  function makeClouds() {
    clouds = [];
    const gx = 28.3, gy = 17.9;                                   // one cloud roughly every 28 x 18 cells
    for (let row = 0, y0 = 4; y0 < rows + 6; row++, y0 += gy) {
      for (let col = 0, x0 = hash(row, 0, 17) * gx - 6; x0 < cols + 10; col++, x0 += gx) {
        const h = (a) => hash(col, row, a);
        const w = 10.5 + 8 * h(1), ht = w * (0.4 + 0.16 * h(2));    // 10.5..18.5 cells wide
        const cx = x0 + (h(3) - 0.5) * gx * 0.9, base = y0 + (h(4) - 0.5) * gy * 0.9 + ht * 0.6;  // loosely scattered
        const puffs = [], n = 3 + Math.floor(h(5) * 3);
        for (let i = 0; i < n; i++) {
          const u = n === 1 ? 0.5 : i / (n - 1), hump = Math.sin(Math.PI * (0.15 + 0.7 * u));
          const r = ht * (0.45 + 0.45 * hump) * (0.85 + 0.3 * hash(col * 7 + i, row, 9));
          puffs.push({ x: cx - w / 2 + w * u, y: base - r * 0.75, r });
        }
        if (h(6) > 0.3) puffs.push({ x: cx + (h(7) - 0.5) * w * 0.3, y: base - ht * 0.95, r: ht * 0.5 });  // a crown on top
        clouds.push({ base, ht, puffs, x0: cx - w, x1: cx + w, y0: base - ht * 2, y1: base + 1 });
      }
    }
  }
  function skyValue(X, Y) {
    let v = 0.92 - 0.3 * Y / rows + 0.08 * (noise(X / 6, Y / 4, 141) - 0.5);   // open sky
    for (const c of clouds) {
      if (X < c.x0 || X > c.x1 || Y < c.y0 || Y > c.y1) continue;
      let d = 9, near = null;
      for (const q of c.puffs) { const dq = Math.hypot(X - q.x, Y - q.y) / q.r; if (dq < d) { d = dq; near = q; } }
      const flat = Math.max(0, Y - c.base + 0.4) * 1.2;                         // flat base
      const inside = Math.max(0, Math.min(1, (1.05 - d) / 0.3)) * Math.max(0, 1 - flat);
      if (inside <= 0) continue;
      // Light from the upper left: each puff is brightest on its upper-left face and turns into shadow
      // on its lower right, and the whole cloud darkens toward its flat underside.
      const nx = (X - near.x) / near.r, ny = (Y - near.y) / near.r;
      const facing = Math.max(0, Math.min(1, 0.5 + 0.45 * ny + 0.3 * nx));
      const under = Math.max(0, Math.min(1, (Y - (c.base - c.ht * 0.5)) / (c.ht * 0.5)));
      const shade = 0.02 + 0.3 * facing * facing + 0.22 * under;
      v = v * (1 - inside) + shade * inside;
    }
    return v;
  }

  let skyBuiltFor = '';
  function buildSky() {
    const fc = Math.ceil(cols * SKY_DENSITY), fr = Math.ceil(rows * SKY_DENSITY) + 1;
    const key = fc + 'x' + fr + '@' + W + 'x' + H;
    if (key === skyBuiltFor) return;                           // the sky is fixed; rebuild only on resize
    skyBuiltFor = key;
    sky = new Float32Array(fc * fr);
    makeClouds();
    // Puff up the cloud edges: where the map is between sky and cloud, rounded billows (from noise)
    // push the cloud out into the sky or let the sky bite in, and the edge is firmed up so each puff
    // reads as a soft rounded lobe instead of a ragged dither.
    for (let y = 0; y < fr; y++) for (let x = 0; x < fc; x++) {
      const X = x / SKY_DENSITY, Y = y / SKY_DENSITY;
      let v = skyValue(X, Y);
      const n1 = noise(X / 3.2, Y / 2.6, 151), n2 = noise(X / 1.6, Y / 1.3, 157);
      const billow = 1 - Math.abs(2 * (0.65 * n1 + 0.35 * n2) - 1);      // 1 at the crown of a puff
      const edge = 4 * v * (1 - v);                                       // strongest where sky meets cloud
      v -= edge * 0.45 * (billow - 0.45);
      if (v < 0.4) v += 0.16 * (1 - billow) ** 2 * (1 - v / 0.4);          // soft shade in the creases between puffs
      v = v < 0.5 ? 0.5 * Math.pow(Math.max(0, 2 * v), 1.2) : 1 - 0.5 * Math.pow(Math.max(0, 2 - 2 * v), 1.2);
      sky[y * fc + x] = Math.min(1, Math.max(0, v));
    }
  }

  // ---- Layout ------------------------------------------------------------
  function layout() {
    W = banner.clientWidth; H = banner.clientHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cell = W / COLS;
    rows = Math.ceil(H / cell);
    const fw = Math.round(COLS * FIELD_W);
    field.c0 = Math.round((COLS - fw) / 2);
    field.c1 = field.c0 + fw - 1;
    field.r0 = Math.round(rows * FIELD_TOP);
    field.r1 = rows - 1;
    for (const cv of [gridCanvas, dissolveCanvas, stitchCanvas, nameCanvas, birdCanvas]) {
      cv.width = Math.round(W * DPR);
      cv.height = Math.round(H * DPR);
    }
    drawGrid();
    sampleTone();
    placeWords();
    drawNameText();
    clouds = [];
    buildSky();
    drawSkyBg();
    live.clear();
  }

  // Shrink the portrait to one pixel per fine stitch (SUB x SUB per cell), exactly where CSS places it.
  function sampleTone() {
    cols = COLS;
    const fc = cols * SUB, fr = rows * SUB;
    tone = new Float32Array(fc * fr).fill(-1);
    person = new Uint8Array(cols * rows);
    if (!portrait.complete || !portrait.naturalWidth) return;
    const ih = H * 0.70, iw = ih * portrait.naturalWidth / portrait.naturalHeight;
    const ix = (W - iw) / 2, iy = H - ih, f = SUB / cell;
    const off = document.createElement('canvas');
    off.width = fc; off.height = fr;
    const o = off.getContext('2d', { willReadFrequently: true });
    o.imageSmoothingQuality = 'high';
    o.drawImage(portrait, ix * f, iy * f, iw * f, ih * f);
    const d = o.getImageData(0, 0, fc, fr).data;
    for (let i = 0; i < fc * fr; i++) {
      if (d[i * 4 + 3] < 24) continue;                         // include the soft, wispy edge of the hair
      let L = d[i * 4] / 255;
      L = Math.min(1, L * (1 + 0.15 * Math.min(1, Math.max(0, (L - 0.4) / 0.45))));  // lift highlights 15%
      tone[i] = Math.min(1, Math.max(0, 1 - (L - 0.14) / 0.62));
      person[Math.floor(Math.floor(i / fc) / SUB) * cols + Math.floor((i % fc) / SUB)]++;
    }
    buildDissolve(ix, iy, iw, ih);
  }

  // The bottom of the photo turns into greyscale cross-stitches, echoing the stitched sky above: the
  // photo fades out smoothly across the band while stitches in its own greys build up over it, denser
  // lower down, then thin out at the banner's bottom edge. No hard blocks, so there are no seams.
  const DISSOLVE = 0.24;                                 // bottom share of the photo that dissolves
  function buildDissolve(ix, iy, iw, ih) {
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dctx.clearRect(0, 0, W, H);
    const y0 = H - ih * DISSOLVE, fc = cols * SUB, s = cell / SUB;
    const grad = `linear-gradient(to bottom, #000 ${((1 - DISSOLVE) * 100).toFixed(2)}%, rgba(0,0,0,0.35) ${((1 - DISSOLVE * 0.35) * 100).toFixed(2)}%, transparent 100%)`;
    Object.assign(portrait.style, { maskImage: grad, webkitMaskImage: grad, maskSize: '', webkitMaskSize: '', maskPosition: '', webkitMaskPosition: '' });
    for (let j = 0; j < rows * SUB; j++) {
      const cy = (j + 0.5) * s;
      if (cy < y0) continue;
      const f = (cy - y0) / (H - y0);
      const p = Math.min(1, (f / 0.55) ** 1.4) * (1 - 0.45 * Math.max(0, (f - 0.75) / 0.25));
      for (let i = 0; i < fc; i++) {
        const raw = tone[j * fc + i];
        if (raw < 0 || hash(i, j, 223) > p) continue;
        const g = Math.round((236 - 196 * raw) / 8) * 8;
        const sp = stitchSprite(`#${((1 << 24) | (g << 16) | (g << 8) | g).toString(16).slice(1)}`);
        dctx.drawImage(sp.cv, (i + 0.5) * s - sp.size / 2, cy - sp.size / 2, sp.size, sp.size);
      }
    }
  }


  // Faint grid inside the stitch field only, like a panel of aida cloth.
  function drawGrid() {
    gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    gctx.clearRect(0, 0, W, H);
    const x0 = field.c0 * cell, x1 = (field.c1 + 1) * cell;
    const y0 = field.r0 * cell, y1 = H;
    gctx.strokeStyle = M.grid;
    gctx.lineWidth = 1 / DPR;
    gctx.beginPath();
    for (let c = field.c0; c <= field.c1 + 1; c++) { const x = c * cell; gctx.moveTo(x, y0); gctx.lineTo(x, y1); }
    for (let r = field.r0; r * cell <= y1; r++) { const y = r * cell; gctx.moveTo(x0, y); gctx.lineTo(x1, y); }
    gctx.stroke();
  }

  // ---- Stitching ---------------------------------------------------------
  const live = new Map();      // key -> { c, r, t } time the stitch was laid
  let last = null, running = false;

  function stitchAt(px, py, now) {
    const cc = px / cell, cr = py / cell;
    const R = Math.ceil(BRUSH);
    for (let r = Math.floor(cr) - R; r <= Math.floor(cr) + R; r++) {
      if (r < field.r0 || r > field.r1) continue;
      for (let c = Math.floor(cc) - R; c <= Math.floor(cc) + R; c++) {
        if (c < field.c0 || c > field.c1) continue;
        const dx = c + 0.5 - cc, dy = r + 0.5 - cr;
        // Ragged brush edge, fixed per cell, so trails look hand-worked rather than round.
        const reach = BRUSH * (0.65 + 0.55 * hash(c, r, 3));
        if (dx * dx + dy * dy > reach * reach) continue;
        live.set(c + ',' + r, { c, r, t: now });
      }
    }
  }

  function onMove(e) {
    const rect = banner.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const now = performance.now();
    // Fill the gap between pointer samples so fast moves leave a continuous trail.
    if (last) {
      const dist = Math.hypot(x - last.x, y - last.y);
      const steps = Math.min(200, Math.ceil(dist / (cell * 1.2)));
      for (let i = 1; i <= steps; i++) stitchAt(last.x + (x - last.x) * i / steps, last.y + (y - last.y) * i / steps, now);
    } else {
      stitchAt(x, y, now);
    }
    last = { x, y };
    if (!running) { running = true; requestAnimationFrame(frame); }
  }

  // Over the person: each cell becomes SUB x SUB fine stitches; tone sets thread colour, weight and stitch type.
  // Highlights get a short, thin, pale half stitch (/); mid-tones a fuller one; shadows a heavy navy cross.
  function drawPortraitBacking(c, r, alpha) {
    sctx.globalAlpha = alpha;
    sctx.fillStyle = M.paper;
    // Snap the backing to whole device pixels so neighbouring cells meet exactly, with no seam.
    const bx0 = Math.floor(c * cell * DPR) / DPR, bx1 = Math.floor((c + 1) * cell * DPR) / DPR;
    const by0 = Math.floor(r * cell * DPR) / DPR, by1 = Math.floor((r + 1) * cell * DPR) / DPR;
    sctx.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
  }
  function drawPortraitCell(c, r, alpha) {
    sctx.globalAlpha = alpha;
    const s = cell / SUB, fc = cols * SUB;
    for (let j = 0; j < SUB; j++) for (let i = 0; i < SUB; i++) {
      const raw = tone[(r * SUB + j) * fc + c * SUB + i];
      if (raw < 0) continue;                                     // edge stitch that falls off the person
      let t = M.invert ? 1 - raw : raw;
      // On charcoal the darkest areas (her hair) would otherwise get thin, near-black strokes; give them
      // full crosses in a dark maroon thread instead, so the hair reads as maroon.
      if (M.invert && raw > 0.55) {
        const d = (raw - 0.55) / 0.45;
        sctx.strokeStyle = `rgb(${Math.round(124 - 34 * d)},${Math.round(30 - 10 * d)},${Math.round(40 - 12 * d)})`;
        sctx.lineWidth = s * 0.36;
        const g2 = s * 0.15, a0 = (c * SUB + i) * s + g2, b0 = (r * SUB + j) * s + g2, a1 = (c * SUB + i + 1) * s - g2, b1 = (r * SUB + j + 1) * s - g2;

      bctx.beginPath();
      for (let i = 0; i < pts.length; i += 2) {
        const x = pts[i] + off, y = pts[i + 1] + off;
        bctx.moveTo(x - half, y - half); bctx.lineTo(x + half, y + half);
        bctx.moveTo(x + half, y - half); bctx.lineTo(x - half, y + half);
      }
      bctx.stroke();
    }
    bctx.globalAlpha = 1;
  }

  function birdFrame(now) {
    const dt = Math.min(0.05, (now - birdLast) / 1000 || 0.016);
    birdLast = now;
    if (pointer) {
      let tx = pointer.x, ty = pointer.y;
      const dist = Math.hypot(tx - bird.x, ty - bird.y);
      if (dist < 70) {                                       // caught up: circle the cursor
        const a = now / 900;
        tx += Math.cos(a) * 55; ty += Math.sin(a) * 40;
      }
      const d = Math.hypot(tx - bird.x, ty - bird.y) || 1;
      const speed = Math.min(620, 120 + d * 3);
      const steer = Math.min(1, dt * 3.2);
      bird.vx += ((tx - bird.x) / d * speed - bird.vx) * steer;
      bird.vy += ((ty - bird.y) / d * speed - bird.vy) * steer;
    } else {                                                 // cursor gone: keep flying the way it was heading
      bird.vx *= 1 + dt * 0.6; bird.vy *= 1 + dt * 0.6;
    }
    bird.x += bird.vx * dt; bird.y += bird.vy * dt;
    const v = Math.hypot(bird.vx, bird.vy);
    if (v > 5) {                                             // turn smoothly to face the way it is flying
      let turn = Math.atan2(bird.vy, bird.vx) - bird.heading;
      turn = Math.atan2(Math.sin(turn), Math.cos(turn));
      bird.heading += turn * Math.min(1, dt * 5);
    }
    bird.phase += dt * (6 + v / 80);                         // unhurried wingbeats, a little faster at speed
    bird.alpha = Math.max(0, Math.min(1, bird.alpha + (pointer ? dt * 3 : -dt * 1.6)));
    drawBird();
    if (pointer || bird.alpha > 0) requestAnimationFrame(birdFrame);
    else birdRunning = false;
  }

  function birdTrack(e) {
    if (reduceMotion) return;
    const rect = banner.getBoundingClientRect();
    pointer = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    if (!bird.started || bird.alpha === 0) {                // enter from behind and below the cursor
      bird.started = true;
      bird.x = pointer.x - 180; bird.y = pointer.y + 90;
      bird.vx = 260; bird.vy = -120; bird.heading = Math.atan2(-120, 260);
    }
    if (!birdRunning) { birdRunning = true; birdLast = performance.now(); requestAnimationFrame(birdFrame); }
  }

  banner.addEventListener('pointermove', (e) => { onMove(e); birdTrack(e); });
  banner.addEventListener('pointerdown', (e) => { last = null; onMove(e); birdTrack(e); });
  banner.addEventListener('pointerleave', () => { last = null; pointer = null; });
  banner.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') { last = null; pointer = null; } });

  // ---- Film grain --------------------------------------------------------
  function makeGrain() {
    const size = 256, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const n = Math.round(size * dpr);
    const c = document.createElement('canvas');
    c.width = c.height = n;
    const g = c.getContext('2d');
    const img = g.createImageData(n, n);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 128 + (Math.random() + Math.random() + Math.random() - 1.5) * 75;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
  }

  // ---- Charcoal mode toggle -----------------------------------------------
  const toggle = document.getElementById('modeToggle');
  function setMode(name) {
    M = MODES[name];
    document.documentElement.dataset.mode = name;
    toggle.setAttribute('aria-pressed', String(name === 'dark'));
    toggle.setAttribute('aria-label', name === 'dark' ? 'Switch to light mode' : 'Switch to charcoal mode');
    try { localStorage.setItem('stitch-mode', name); } catch (e) {}
    if (W) { drawGrid(); drawSkyBg(); sampleTone(); drawNameText(); }
    if (live.size && !running) { running = true; requestAnimationFrame(frame); }
  }
  toggle.addEventListener('pointerdown', (e) => e.stopPropagation());
  toggle.addEventListener('click', () => setMode(M === MODES.dark ? 'light' : 'dark'));
  let saved = null;
  try { saved = localStorage.getItem('stitch-mode'); } catch (e) {}
  setMode(saved === 'dark' ? 'dark' : 'light');

  if (!reduceMotion) requestAnimationFrame(skyLoop);

  if (document.fonts) Promise.all(['700 40px "Space Mono"', '400 40px "Space Mono"', 'italic 400 40px "Space Mono"'].map(f => document.fonts.load(f))).then(() => drawNameText()).catch(() => {});

  makeGrain();
  portrait.addEventListener('load', sampleTone);
  new ResizeObserver(layout).observe(banner);
  layout();
</script>

</body></html>
